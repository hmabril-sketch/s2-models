name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Unit tests
        run: pytest -q
      - name: Examples
        run: |
          python examples/paper_example.py
          python examples/isomorphism_test.py
      - name: Cubic graph experiment (Table 3)
        run: |
          python scripts/download_data.py
          python experiments/run_experiments.py --family cubic --cache-dir /tmp/cache --out-dir /tmp/out
